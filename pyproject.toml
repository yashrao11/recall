[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-memory"
version = "0.1.0"
description = "A local-first multimodal personal memory and knowledge system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "certifi>=2024.2,<2027",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]
ingestion = [
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pillow>=10,<12",
]
ai = ["google-genai>=1.0,<2"]
retrieval = [
  "numpy>=2,<3",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3,<6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]

